[project]
name = "unsloth-samples"
version = "0.1.0"
description = "Unsloth LLM Fine-tuning Samples"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "unsloth[colab-new] @ git+https://github.com/unslothai/unsloth.git",
    "torch>=2.1.0",
    "transformers>=4.36.0",
    "datasets>=2.15.0",
    "accelerate>=0.25.0",
    "bitsandbytes>=0.41.0",
    "trl>=0.7.4",
    "peft>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "ipykernel>=6.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "jupyter>=1.0.0",
    "ipykernel>=6.27.0",
]
